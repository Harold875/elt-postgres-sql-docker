services:
  source_postgres:
    # image: postgres:18.4-trixie
    image: postgres:17-trixie
    ports:
      - "5433:5432"
    networks:
      - elt_network
    environment:
      - POSTGRES_DB=source_db
      - POSTGRES_USER=harold
      - POSTGRES_PASSWORD=secret
    volumes:
      - ./source_db_init/init.sql:/docker-entrypoint-initdb.d/init.sql
  
  destination_postgres:
    image: postgres:17-trixie
    ports:
      - "5432:5432"
    networks:
      - elt_network
    environment:
      POSTGRES_USER: harold
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: destination_db

  # elt_script:
  #   build:
  #     context: ./elt
  #     dockerfile: Dockerfile
  #   depends_on:
  #     - source_postgres
  #     - destination_postgres
  #   networks:
  #     - elt_network
  
  # dbt:
  #   image: ghcr.io/dbt-labs/dbt-postgres:1.4.7
  #   command: 
  #     [
  #       "run",
  #       "--profiles-dir",
  #       "/root",
  #       "--project-dir",
  #       "/dbt"
  #     ]
  #   networks:
  #     - elt_network
  #   volumes:
  #     - ./custom_postgres:/dbt
  #     - ~/.dbt:/root
  #   depends_on:
  #     - elt_script
  #   environment:
  #     DBT_PROFILE: default
  #     DBT_TARGET: dev


  # database for airflow
  postgres:
    image: postgres:17-trixie
    networks:
      - elt_network
    environment:
      - POSTGRES_DB=airflow
      - POSTGRES_USER=airflow
      - POSTGRES_PASSWORD=airflow
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
  init-airflow:
    image: apache/airflow:2.11.2-python3.12
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - elt_network
    environment:
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql://airflow:airflow@postgres/airflow
    command: >
      bash -c "airflow db init && 
              airflow users create --username airflow --password password --firstname John --lastname Doe --role Admin --email admin@example.com"

  webserver:
    build:
      context: .
      dockerfile: Dockerfile
    user: root
    depends_on:
      destination_postgres:
        condition: service_started
      postgres:
        condition: service_healthy 
      init-airflow: 
        condition: service_completed_successfully
    networks:
      - elt_network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./elt:/opt/airflow/elt
      - ./custom_postgres:/opt/dbt
      - ~/.dbt:/root/.dbt
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - DBT_PROJECT_DIR=${DBT_PROJECT_DIR:?DBT_PROJECT_DIR environment variable is required}
      - DBT_PROFILE=${DBT_PROFILE:?DBT_PROFILE environment variable is required}
      - LOAD_EX=n
      - EXECUTOR=local
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql://airflow:airflow@postgres/airflow
      - AIRFLOW__CORE__FERNET_KEY=ZGBvd7NEnKQNnDrhFw4zG9XBcdTYjL-aTOi2uTI3JGM=      #  python3 -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
      - AIRFLOW__WEBSERVER__DEFAULT__USER_USERNAME=airflow
      - AIRFLOW__WEBSERVER__DEFAULT__USER_USERNAME=password
      - AIRFLOW_WWW_USER_USERNAME=airflow
      - AIRFLOW_WWW_USER_PASSWORD=password
      - AIRFLOW__WEBSERVER__SECRET_KEY=secret

    ports:
      - "8080:8080"

    command: webserver

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    user: root
    depends_on:
      init-airflow: 
        condition: service_completed_successfully
    networks:
      - elt_network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./elt:/opt/airflow/elt
      - ./custom_postgres:/opt/dbt
      - ~/.dbt:/root/.dbt
      - /var/run/docker.sock:/var/run/docker.sock

    environment:
      - DBT_PROJECT_DIR=${DBT_PROJECT_DIR:?DBT_PROJECT_DIR environment variable is required}
      - DBT_PROFILE=${DBT_PROFILE:?DBT_PROFILE environment variable is required}
      - LOAD_EX=n
      - EXECUTOR=local
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql://airflow:airflow@postgres/airflow
      - AIRFLOW__CORE__FERNET_KEY=ZGBvd7NEnKQNnDrhFw4zG9XBcdTYjL-aTOi2uTI3JGM=      #  python3 -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
      - AIRFLOW__WEBSERVER__DEFAULT__USER_USERNAME=airflow
      - AIRFLOW__WEBSERVER__DEFAULT__USER_USERNAME=password
      - AIRFLOW_WWW_USER_USERNAME=airflow
      - AIRFLOW_WWW_USER_PASSWORD=password
      - AIRFLOW__WEBSERVER__SECRET_KEY=secret

    command: scheduler

networks:
  elt_network:
    driver: bridge